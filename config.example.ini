# 下载结束自动关机 - 阈值配置示例
# 复制本文件为 config.ini 后使用，或在软件主界面点击“设置”修改。
# 速率单位可填写：B/s、KB/s、MB/s、GB/s（默认 KB/s）；
# CPU 单位：%；持续时间单位：分钟；倒计时单位：秒。

[thresholds]
# 网络下载速度低于该值时，视为网络活动较低
net_low_value = 100
net_low_unit = KB/s

# 磁盘写入速度低于该值时，视为磁盘活动较低
disk_low_value = 700
disk_low_unit = KB/s

# CPU 占用率低于该值时，视为 CPU 活动较低（大于 0 且不超过 100）
cpu_low_percent = 10

# 三项同时低于阈值并持续该时长后，进入关机倒计时（支持小数，如 0.5）
low_activity_minutes = 10

# 触发后等待多少秒再关机，期间可以取消（范围 1~3600）
countdown_seconds = 120
